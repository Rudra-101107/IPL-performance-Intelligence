<style>
	#lovable-badge {
		--badge-bg: #1b1b1b;
		--badge-text: #c5c1b9;
		--badge-text-hover: #dcdad5;
		--badge-radius: 6px;
		--badge-padding: 8px;
		--badge-gap: 6px;
		--badge-shadow: 
			0 0 0 1px rgba(0, 0, 0, 0.88),
			0 1px 0 0 rgba(0, 0, 0, 0.04),
			0 2px 2px -1px rgba(0, 0, 0, 0.08),
			0 4px 4px -2px rgba(0, 0, 0, 0.08),
			0 8px 8px -4px rgba(0, 0, 0, 0.08),
			0 16px 16px -8px rgba(0, 0, 0, 0.08);
		--badge-transition-duration: 0.2s;
		--badge-transition-easing: cubic-bezier(0.16, 1, 0.32, 1);
		--focus-color: #575ECF;
		--focus-offset: 2px;
		--focus-width: 2px;
		
		position: fixed;
		bottom: 12px;
		right: 12px;
		height: 24px;
		display: flex;
		align-items: center;
		z-index: 1000000;
		background-color: var(--badge-bg) !important;
		color: var(--badge-text) !important;
		border-radius: var(--badge-radius);
		box-shadow: var(--badge-shadow) !important;
		font-size: 12px;
		font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		font-weight: 400 !important;
		text-transform: none !important;
		font-feature-settings: normal !important;
		transform: translateZ(0);
		will-change: transform, opacity;
		transition: opacity var(--badge-transition-duration) var(--badge-transition-easing);
	}

	#lovable-badge.closing {
		opacity: 0;
		pointer-events: none;
	}

	#lovable-badge-cta {
		display: flex;
		align-items: baseline;
		gap: var(--badge-gap);
		box-sizing: border-box;
		padding: 4px var(--badge-padding) 0;
		height: 100%;
		color: inherit;
		text-decoration: none;
		white-space: nowrap;
		border-radius: var(--badge-radius) 0 0 var(--badge-radius);
		transition: 
			background-color var(--badge-transition-duration) ease,
			color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-cta:hover {
		background: rgba(255, 255, 255, 0.04);
		color: var(--badge-text-hover);
	}

	#lovable-badge-cta:active {
		transform: scale(0.98);
	}

	#lovable-badge-cta:focus {
		outline: none;
	}

	#lovable-badge-cta:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: var(--focus-offset);
		z-index: 1;
	}

	#lovable-badge-text {
		line-height: 1;
	}

	/* The wordmark baseline sits at y=12 of the 16px logo; an empty 12px box
	   makes that the flex baseline so the text aligns to it on any system font. */
	#lovable-badge-logo {
		position: relative;
		display: block;
		width: 52px;
		height: 12px;
	}

	#lovable-badge-logo svg {
		position: absolute;
		top: 0;
		left: 0;
	}

	#lovable-badge-divider {
		width: 1px;
		height: 24px;
		background-color: rgba(255, 255, 255, 0.04);
		flex-shrink: 0;
	}

	#lovable-badge-close {
		width: 24px;
		height: 24px;
		min-width: 24px;
		min-height: 24px;
		cursor: pointer;
		background: none;
		border: none;
		padding: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 0 var(--badge-radius) var(--badge-radius) 0;
		flex-shrink: 0;
		transition: 
			background-color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-close:hover {
		background: rgba(255, 255, 255, 0.04);
	}

	#lovable-badge-close:active {
		transform: scale(0.92);
	}

	#lovable-badge-close:focus {
		outline: none;
	}

	#lovable-badge-close:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: calc(var(--focus-offset) * -1);
		z-index: 1;
	}

	#lovable-badge-close svg path {
		fill: var(--badge-text);
		transition: fill var(--badge-transition-duration) ease;
	}

	#lovable-badge-close:hover svg path {
		fill: var(--badge-text-hover);
	}

	@media (prefers-reduced-motion: reduce) {
		#lovable-badge,
		#lovable-badge-cta,
		#lovable-badge-close,
		#lovable-badge-close svg path {
			transition: none;
		}
		
		#lovable-badge-cta:active,
		#lovable-badge-close:active {
			transform: none;
		}
	}

	@media (prefers-contrast: high) {
		#lovable-badge {
			--badge-bg: #000;
			--badge-text: #fff;
			--badge-text-hover: #fff;
			border: 2px solid currentColor;
		}
		
		#lovable-badge-cta:focus-visible,
		#lovable-badge-close:focus-visible {
			outline-width: 3px;
		}
	}
</style>

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;layout&quot;&gt;
&lt;aside class=&quot;side&quot;&gt;&lt;div class=&quot;brand&quot;&gt;IPL&lt;span style=&quot;color:#f4c84a&quot;&gt;.&lt;/span&gt;&lt;small&gt;PERFORMANCE INTELLIGENCE&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;Explore how scoring pace, boundary dependence and wickets change across seasons, teams and match phases.&lt;/p&gt;
&lt;label for=&quot;season&quot;&gt;SEASON FILTER&lt;/label&gt;&lt;select id=&quot;season&quot;&gt;&lt;option value=&quot;ALL&quot;&gt;All available seasons&lt;/option&gt;&lt;/select&gt;
&lt;label for=&quot;team&quot;&gt;TEAM FILTER&lt;/label&gt;&lt;select id=&quot;team&quot;&gt;&lt;option value=&quot;ALL&quot;&gt;All batting teams&lt;/option&gt;&lt;/select&gt;
&lt;div class=&quot;hint&quot;&gt;Tip: compare rates alongside match counts. Raw totals often reward teams or seasons with more matches.&lt;/div&gt;&lt;/aside&gt;
&lt;main&gt;&lt;div class=&quot;eyebrow&quot;&gt;Cricket analytics • descriptive, not just totals&lt;/div&gt;&lt;h1&gt;IPL Performance Dashboard&lt;/h1&gt;
&lt;p class=&quot;subtitle&quot;&gt;A decision-focused view of scoring efficiency, match intensity and player impact. Use the filters to compare like-for-like seasons and teams.&lt;/p&gt;
&lt;div class=&quot;kpis&quot; id=&quot;kpis&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;01 / What is changing across seasons?&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Scoring pace by season&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Run rate normalizes scoring by legal deliveries, helping compare seasons with different match volumes.&lt;/p&gt;&lt;div id=&quot;seasonRate&quot; class=&quot;chart&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Run production vs scoring pace&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Each point is a season. A high total with modest pace can mean more matches, not necessarily more aggressive cricket.&lt;/p&gt;&lt;div id=&quot;seasonScatter&quot; class=&quot;chart&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;02 / Team style and efficiency&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Team scoring profile&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Compare average runs per match rather than rewarding teams only for playing more matches.&lt;/p&gt;&lt;div id=&quot;teamRPM&quot; class=&quot;chart&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Boundary dependence vs run rate&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Higher boundary share indicates more runs coming from fours and sixes; pace shows how quickly runs are scored.&lt;/p&gt;&lt;div id=&quot;teamScatter&quot; class=&quot;chart&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;03 / Match phases and player impact&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;How scoring changes by innings phase&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Powerplay, middle and death phase run rates reveal when teams accelerate and where wicket risk rises.&lt;/p&gt;&lt;div id=&quot;phaseChart&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;High strike-rate batters&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Players are screened for at least 500 recorded balls and 20 matches to reduce tiny-sample distortions.&lt;/p&gt;&lt;div id=&quot;batChart&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Economical wicket-taking bowlers&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Economy is shown with a 100-over and 20-match minimum; validate run attribution before treating it as official.&lt;/p&gt;&lt;div id=&quot;bowlChart&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Higher-scoring venues&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Average runs per match for venues with at least 10 matches in the dataset.&lt;/p&gt;&lt;div id=&quot;venueChart&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;04 / Share breakdowns&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Where the runs come from&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Share of all runs scored in each innings phase.&lt;/p&gt;&lt;div id=&quot;phasePie&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;When wickets fall&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Donut of wickets by innings phase.&lt;/p&gt;&lt;div id=&quot;phaseDonut&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Team share of total runs&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Each team&#x27;s portion of all runs in the dataset (top 8, rest grouped).&lt;/p&gt;&lt;div id=&quot;teamPie&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Boundary composition&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Runs from fours, sixes and everything else for the teams in view.&lt;/p&gt;&lt;div id=&quot;boundaryDonut&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;05 / Team by team analysis&lt;/div&gt;
&lt;div class=&quot;panel&quot; style=&quot;margin-bottom:11px&quot;&gt;&lt;h3&gt;Pick a team &lt;select id=&quot;ttTeam&quot; style=&quot;margin-left:8px;padding:4px 6px;border-radius:6px;border:1px solid var(--line)&quot;&gt;&lt;/select&gt;&lt;/h3&gt;&lt;div id=&quot;ttKpis&quot; class=&quot;kpis&quot; style=&quot;margin:10px 8px&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Run makeup&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;How the selected team&#x27;s runs split between fours, sixes and running.&lt;/p&gt;&lt;div id=&quot;ttDonut&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Team vs league average&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Each measure shown as a percent of the league average (100 = average).&lt;/p&gt;&lt;div id=&quot;ttCompare&quot; class=&quot;chart short&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;h3&gt;All teams side by side&lt;/h3&gt;&lt;p class=&quot;explainer&quot;&gt;Ranked by runs per match.&lt;/p&gt;&lt;div id=&quot;ttTable&quot; style=&quot;overflow:auto;margin:8px&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;06 / Insights to investigate&lt;/div&gt;&lt;div class=&quot;insightgrid&quot; id=&quot;insights&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Data interpretation:&lt;/b&gt; The source combines ball-by-ball rows with match-info metadata. This dashboard analyzes only ball-by-ball records. Season totals are not directly comparable if seasons are incomplete. Legal-delivery logic excludes wides and no-balls, but player-specific balls faced and official bowler-conceded runs require more detailed cricket rules (for example, byes and leg-byes are not charged to the bowler). This is a descriptive analytics view, not a measure of causation.&lt;/div&gt;
&lt;/main&gt;&lt;/div&gt;

			const badge = document.querySelector('#lovable-badge');

				badge.style.display = 'none';

			return;
		}

		const closeButton = document.querySelector('#lovable-badge-close');
		if (closeButton) {
			closeButton.addEventListener('click', function(event) {
				event.preventDefault();
				event.stopPropagation();
				const badge = document.querySelector('#lovable-badge');
				if (badge) {
					badge.classList.add('closing');
					setTimeout(function() {
						if (badge) {

						}
					}, 240);
				}
			});
		}
	})();
